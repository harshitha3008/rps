<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock-Paper-Scissors</title>
  <link rel="stylesheet" href="12-rock-paper-scissors.css">
</head>
<body>
  <p class="title">Rock Paper Scissors</p>
  <button class="move-button js-rock-button"><img src="images/rock-emoji.png" class="move-icon"></button>
  <button class="move-button js-paper-button"><img src="images/paper-emoji.png" class="move-icon"></button>
  <button class="move-button js-scissors-button"><img src="images/scissors-emoji.png" class="move-icon"></button>
  <p class="js-result result">You win.</p>
  <p class="js-moves"></p>
  <p class="js-score score"></p>
  <button class="Reset-score-btn js-reset-button">Reset Score</button>
  <button class="auto-play-button js-autoplay-btn">Auto play</button>
  <script src="12-rock-paper.js"></script>
</body>
</html>
